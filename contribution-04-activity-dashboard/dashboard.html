<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Technocore Activity Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 40px 20px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 1.4rem; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .upload-row { margin-bottom: 20px; }
  input[type="file"] { color: var(--text); font-size: 0.85rem; }
  table {
    width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 0.85rem;
  }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { background: #1c2128; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1c2128; }
  .room-badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem;
    background: rgba(88,166,255,0.15); color: var(--accent); border: 1px solid rgba(88,166,255,0.3);
  }
  .seq { color: var(--accent2); font-variant-numeric: tabular-nums; }
  .did { color: var(--muted); font-size: 0.75rem; word-break: break-all; }
  .text-cell { max-width: 320px; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Technocore Activity Dashboard</h1>
  <div class="subtitle">Local ledger of your signed Technocore messages — captured at post time, since the room feed only keeps a rolling window.</div>
  <div class="upload-row">
    <input type="file" id="fileInput" accept=".csv">
  </div>
  <div class="stats" id="stats"></div>
  <table id="table">
    <thead>
      <tr><th>Seq</th><th>Room</th><th>Timestamp</th><th>Message</th><th>DID</th></tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5" class="empty">Load your activity_ledger.csv above to view your history.</td></tr>
    </tbody>
  </table>
</div>
<script>
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
        if (c === '\r' && next === '\n') i++;
      } else { field += c; }
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function render(rows) {
  const [header, ...data] = rows;
  const idx = Object.fromEntries(header.map((h, i) => [h.trim(), i]));
  const tbody = document.getElementById('tbody');
  const statsEl = document.getElementById('stats');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No rows found in this file.</td></tr>';
    return;
  }
  const dids = new Set(data.map(r => r[idx.did]));
  const rooms = new Set(data.map(r => r[idx.room]));
  const seqs = data.map(r => Number(r[idx.seq])).filter(n => !isNaN(n));
  statsEl.innerHTML = `
    <div class="stat"><div class="label">Total Messages</div><div class="value">${data.length}</div></div>
    <div class="stat"><div class="label">Rooms Used</div><div class="value">${[...rooms].join(', ')}</div></div>
    <div class="stat"><div class="label">DIDs Tracked</div><div class="value">${dids.size}</div></div>
    <div class="stat"><div class="label">Seq Range</div><div class="value">${Math.min(...seqs)} → ${Math.max(...seqs)}</div></div>
  `;
  tbody.innerHTML = data
    .sort((a, b) => Number(a[idx.seq]) - Number(b[idx.seq]))
    .map(r => `
      <tr>
        <td class="seq">${r[idx.seq]}</td>
        <td><span class="room-badge">${r[idx.room]}</span></td>
        <td>${(r[idx.timestamp] || '').replace('T', ' ').replace('Z', '')}</td>
        <td class="text-cell">${r[idx.text]}</td>
        <td class="did">${r[idx.did]}</td>
      </tr>
    `).join('');
}
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => render(parseCSV(evt.target.result));
  reader.readAsText(file);
});
</script>
</body>
</html>
